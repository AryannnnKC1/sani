            - heading "Us, all dressed up" [level=2] [ref=f1e23]
            - paragraph [ref=f1e24]: Every little moment with you becomes something worth remembering. Even the ones where we're just standing there being a little silly end up being the ones I smile about later.
        - group [aria-hidden] [ref=f1e25]:
          - figure [ref=f1e27]
          - generic [ref=f1e29]:
            - paragraph [ref=f1e30]: 02 / 17
            - heading [level=2] [ref=f1e31]: You, making days special
            - paragraph [ref=f1e32]: You have this beautiful way of making ordinary days feel special. Nothing has to be planned or fancy; just being around you turns it into a day I want to hold on to.
        - group [aria-hidden] [ref=f1e33]:
          - figure [ref=f1e35]
          - generic [ref=f1e37]:
            - paragraph [ref=f1e38]: 03 / 17
            - heading [level=2] [ref=f1e39]: My favorite feeling
            - paragraph [ref=f1e40]: If I could keep one feeling forever, it would be how happy I feel with you. It's calm and exciting at the same time, and I never want to take it for granted.
        - group [aria-hidden] [ref=f1e41]:
          - figure [ref=f1e43]
          - generic [ref=f1e44]:
            - paragraph [ref=f1e45]: 04 / 17
            - heading [level=2] [ref=f1e46]: Just us
            - paragraph [ref=f1e47]: Some of my favorite memories are the ones where we're simply being ourselves. No pretending, no performing, just two people enjoying each other's company.
        - group [aria-hidden] [ref=f1e48]:
          - figure [ref=f1e50]
          - generic [ref=f1e51]:
            - paragraph [ref=f1e52]: 05 / 17
            - heading [level=2] [ref=f1e53]: My world, a little brighter
            - paragraph [ref=f1e54]: You make my world a little brighter just by being in it. I notice it in the big moments, and honestly even more in the small ones.
        - group [aria-hidden] [ref=f1e55]:
          - figure [ref=f1e57]
          - generic [ref=f1e58]:
            - paragraph [ref=f1e59]: 06 / 17
            - heading [level=2] [ref=f1e60]: The ones still waiting
            - paragraph [ref=f1e61]: Here's to the moments we've shared and all the beautiful ones still waiting for us. I'm really looking forward to every single one of them.
        - group [aria-hidden] [ref=f1e62]:
          - figure [ref=f1e64]
          - generic [ref=f1e65]:
            - paragraph [ref=f1e66]: 07 / 17
            - heading [level=2] [ref=f1e67]: Big sky, bigger smile
            - paragraph [ref=f1e68]: Look at that sky, and then look at you. I hope you always feel as light and open as you look right here.
        - group [aria-hidden] [ref=f1e69]:
          - figure [ref=f1e71]
          - generic [ref=f1e72]:
            - paragraph [ref=f1e73]: 08 / 17
            - heading [level=2] [ref=f1e74]: Any place with you
            - paragraph [ref=f1e75]: Wherever we are, you make it feel like the best place to be. A view is lovely, but it's always better with you standing in it.
        - group [aria-hidden] [ref=f1e76]:
          - figure [ref=f1e78]
          - generic [ref=f1e79]:
            - paragraph [ref=f1e80]: 09 / 17
            - heading [level=2] [ref=f1e81]: Right next to you
            - paragraph [ref=f1e82]: There's nowhere I'd rather be than right next to you. These are the moments I'm quietly grateful for, even when I forget to say it out loud.
        - group [aria-hidden] [ref=f1e83]:
          - figure [ref=f1e85]
          - generic [ref=f1e86]:
            - paragraph [ref=f1e87]: 10 / 17
            - heading [level=2] [ref=f1e88]: Flowers and mountains
            - paragraph [ref=f1e89]: You could put a flower in your hair and make the mountains jealous. Thank you for being someone who makes everything around her a little more beautiful.
        - group [aria-hidden] [ref=f1e90]:
          - figure [ref=f1e92]
          - generic [ref=f1e93]:
            - paragraph [ref=f1e94]: 11 / 17
            - heading [level=2] [ref=f1e95]: Effortless
            - paragraph [ref=f1e96]: Sunglasses, scarf and attitude, and somehow it always works on you. You're allowed to know exactly how cool you are.
        - group [aria-hidden] [ref=f1e97]:
          - figure [ref=f1e99]
          - generic [ref=f1e100]:
            - paragraph [ref=f1e101]: 12 / 17
            - heading [level=2] [ref=f1e102]: Not perfectly clear
            - paragraph [ref=f1e103]: Not every photo is sharp, but the feeling in this one is. Some memories matter because of how they felt, not how they look.
        - group [aria-hidden] [ref=f1e104]:
          - figure [ref=f1e106]
          - generic [ref=f1e107]:
            - paragraph [ref=f1e108]: 13 / 17
            - heading [level=2] [ref=f1e109]: Pure cuteness
            - paragraph [ref=f1e110]: Pure cuteness, on purpose or not, and I love it either way. You make being yourself look easy, and I hope you never stop.
        - group [aria-hidden] [ref=f1e111]:
          - figure [ref=f1e113]
          - generic [ref=f1e114]:
            - paragraph [ref=f1e115]: 14 / 17
            - heading [level=2] [ref=f1e116]: My favorite place
            - paragraph [ref=f1e117]: Your hugs are my favorite place to be. They make everything else feel quieter, and I'm grateful for every single one.
        - group [aria-hidden] [ref=f1e118]:
          - figure [ref=f1e120]
          - generic [ref=f1e121]:
            - paragraph [ref=f1e122]: 15 / 17
            - heading [level=2] [ref=f1e123]: Absolutely stunning
            - paragraph [ref=f1e124]: You looked absolutely stunning, and I hope you know it. But what I admire even more is the person wearing it all.
        - group [aria-hidden] [ref=f1e125]:
